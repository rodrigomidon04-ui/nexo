<html lang="es">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #7dd3fc;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  #pantalla-bienvenida {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #000;
    position: relative;
  }
  #titulo-nexo {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 6px;

    text-shadow: 0 0 10px #3ecbff;
    margin-bottom: 20px;

  #cara-robot {
    width: 220px;
    height: 220px;

  }
  .ojo {
    fill: #3ecbff;
    filter: drop-shadow(0 0 8px #3ecbff);
    transition: all 0.4s ease;
  }
  .pupila {
    fill: #041722;
    transition: opacity 0.3s ease;

  .sorprendido .pupila { transform: scale(1.3); }
  .somnoliento .pupila, .dormido .pupila { opacity: 0; }
  .guino .ojo-der { transform: scaleY(0.1); transform-origin: center; }
  .guino .pupila-der { opacity: 0; }
  .parpado {
    stroke: #3ecbff;
    stroke-width: 6;
    fill: none;
    stroke-linecap: round;
    display: none;
    filter: drop-shadow(0 0 6px #3ecbff);
  }
  .boca {
    stroke: #3ecbff;
    stroke-width: 6;
    fill: none;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px #3ecbff);
    transition: all 0.4s ease;
  }
  .zzz {
    fill: #3ecbff;
    font-size: 22px;
    opacity: 0;
    filter: drop-shadow(0 0 6px #3ecbff);
  }

  .feliz .boca { d: path("M 55 135 Q 100 180 145 135"); }
  .sorprendido .boca { d: path("M 85 150 a 15 15 0 1 0 30 0 a 15 15 0 1 0 -30 0"); }
  .sorprendido .ojo { transform: scale(1.15); }
  .somnoliento .ojo { transform: scaleY(0.15); transform-origin: center; }
  .somnoliento .boca { d: path("M 70 145 Q 100 155 130 145"); opacity: 0.6; }
  .dormido .ojo { display: none; }
  .dormido .parpado { display: block; }
  .dormido .boca { d: path("M 85 150 a 15 15 0 1 0 30 0 a 15 15 0 1 0 -30 0"); opacity: 0.7; }
  .dormido .zzz { animation: flotar 3s infinite; }
  .dormido .zzz.z2 { animation-delay: 1s; }
  .dormido .zzz.z3 { animation-delay: 2s; }
  .sonrisa-grande .boca { d: path("M 50 130 Q 100 195 150 130"); }
  .zigzag .boca { d: path("M 55 140 L 70 150 L 85 140 L 100 150 L 115 140 L 130 150 L 145 140"); }
  .pensativo .boca { d: path("M 70 148 Q 100 152 130 142"); }
  .pensativo .ojo { transform: scale(0.9); transform-origin: center; }

  @keyframes flotar {
    0% { opacity: 0; transform: translateY(0) scale(0.7); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-40px) scale(1.1); }
  }

  #boton-conectar {

    padding: 14px 36px;

  #pantalla-llamada {
    display: none;

  #video-remoto {

  #datos-llamada {

  #controles-llamada {

  #boton-colgar {

  #boton-silenciar {

  #contenedor-video-local {

<script>
const URL_SERVIDOR_SEÑALIZACION = "wss://nexo-3c3p.onrender.com";

const ICE_SERVERS = [
  { urls: "stun:stun.relay.metered.ca:80" },
  {
    urls: "turn:standard.relay.metered.ca:80",
    username: "2159484b4463174120df1655",
    credential: "Om2rSFYCd/QfWgPt"
  },
  {
    urls: "turn:standard.relay.metered.ca:443",
    username: "2159484b4463174120df1655",
    credential: "Om2rSFYCd/QfWgPt"
  }
];

const caraRobot = document.getElementById('cara-robot');
let temporizadorSomnoliento;
let temporizadorDormido;
let contextoAudio;

function obtenerAudio() {
  if (!contextoAudio) {
    contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
  }
  return contextoAudio;
}

function sonidoBip(frecuencia, duracion) {
  const ctx = obtenerAudio();
  const osc = ctx.createOscillator();
  const volumen = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = frecuencia;
  volumen.gain.setValueAtTime(0.08, ctx.currentTime);
  volumen.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duracion);
  osc.connect(volumen);
  volumen.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duracion);
}

let osciladorRonquido = null;
function iniciarRonquido() {
  const ctx = obtenerAudio();
  osciladorRonquido = ctx.createOscillator();
  const volumen = ctx.createGain();
  osciladorRonquido.type = 'sine';
  osciladorRonquido.frequency.value = 90;
  volumen.gain.value = 0.03;
  osciladorRonquido.connect(volumen);
  volumen.connect(ctx.destination);
  osciladorRonquido.start();

  let subiendo = true;
  osciladorRonquido._intervalo = setInterval(() => {
    const ahora = ctx.currentTime;
    volumen.gain.linearRampToValueAtTime(subiendo ? 0.06 : 0.01, ahora + 0.8);
    subiendo = !subiendo;
  }, 800);
}
function detenerRonquido() {
  if (osciladorRonquido) {
    clearInterval(osciladorRonquido._intervalo);
    osciladorRonquido.stop();
    osciladorRonquido = null;
  }
}

function ponerEstado(estado) {
  caraRobot.className = '';
  if (estado) caraRobot.classList.add(estado);
  if (estado !== 'dormido') detenerRonquido();
}

function reiniciarTemporizadoresReposo() {
  clearTimeout(temporizadorSomnoliento);
  clearTimeout(temporizadorDormido);
  detenerRonquido();

  temporizadorSomnoliento = setTimeout(() => {
    ponerEstado('somnoliento');
  }, 8000);

  temporizadorDormido = setTimeout(() => {
    ponerEstado('dormido');
    iniciarRonquido();
  }, 25000);
}

caraRobot.addEventListener('click', () => {
  ponerEstado('feliz');
  sonidoBip(600, 0.15);
  reiniciarTemporizadoresReposo();
  setTimeout(() => ponerEstado(null), 1200);
});

document.addEventListener('keydown', () => {
  ponerEstado('sorprendido');
  sonidoBip(880, 0.1);
  reiniciarTemporizadoresReposo();
  setTimeout(() => ponerEstado(null), 800);
});

document.addEventListener('mousemove', reiniciarTemporizadoresReposo);

// ---------- GESTOS ALEATORIOS ----------
const gestosAleatorios = ['guino', 'sonrisa-grande', 'zigzag', 'pensativo'];

function programarGestoAleatorio() {
  const espera = 6000 + Math.random() * 9000;
  setTimeout(() => {
    if (caraRobot.className.trim() === '') {
      const gesto = gestosAleatorios[Math.floor(Math.random() * gestosAleatorios.length)];
      ponerEstado(gesto);
      setTimeout(() => ponerEstado(null), 900);
    }
    programarGestoAleatorio();
  }, espera);
}
programarGestoAleatorio();

const pupilaIzq = document.querySelector('.pupila-izq');
const pupilaDer = document.querySelector('.pupila-der');
const centroOjoIzq = { x: 65, y: 90 };
const centroOjoDer = { x: 135, y: 90 };
const radioMovimiento = 6;

function moverPupilas(mouseX, mouseY) {
  const punto = caraRobot.createSVGPoint();
  punto.x = mouseX;
  punto.y = mouseY;
  const ctm = caraRobot.getScreenCTM();
  if (!ctm) return;
  const puntoSVG = punto.matrixTransform(ctm.inverse());

  [[pupilaIzq, centroOjoIzq], [pupilaDer, centroOjoDer]].forEach(([pupila, centro]) => {
    const dx = puntoSVG.x - centro.x;
    const dy = puntoSVG.y - centro.y;
    const distancia = Math.sqrt(dx * dx + dy * dy) || 1;
    const factor = Math.min(radioMovimiento, distancia) / distancia;
    pupila.setAttribute('transform', `translate(${dx * factor}, ${dy * factor})`);
  });
}
document.addEventListener('mousemove', (e) => moverPupilas(e.clientX, e.clientY));

let esDeNocheGlobal = false;
let hayLluviaGlobal = false;

function actualizarRelojYFecha() {
  const ahora = new Date();
  const horas = String(ahora.getHours()).padStart(2, '0');
  const minutos = String(ahora.getMinutes()).padStart(2, '0');
  document.getElementById('reloj-hora').textContent = `${horas}:${minutos}`;

  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('reloj-fecha').textContent =
    `${dias[ahora.getDay()]}, ${ahora.getDate()} de ${meses[ahora.getMonth()]}`;

  esDeNocheGlobal = ahora.getHours() >= 20 || ahora.getHours() < 7;
  dibujarIconoCielo();
}

function dibujarIconoCielo() {
  const icono = document.getElementById('icono-cielo');
  if (hayLluviaGlobal) {
    icono.innerHTML =
      '<path d="M6 14a4 4 0 0 1 .5-7.97A5.5 5.5 0 0 1 17 8.5 3.5 3.5 0 0 1 16.5 15H6z" fill="#7dd3fc" opacity="0.7"/>' +
      '<line x1="8" y1="17" x2="7" y2="20" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>' +
      '<line x1="12" y1="17" x2="11" y2="21" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>' +
      '<line x1="16" y1="17" x2="15" y2="20" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>';
    return;
  }
  icono.innerHTML = esDeNocheGlobal
    ? '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="#7dd3fc" />'
    : '<circle cx="12" cy="12" r="5" fill="#facc15" /><g stroke="#facc15" stroke-width="1.5"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></g>';
}

function consultarClima(lat, lon) {
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=precipitation,weather_code`)
    .then(respuesta => respuesta.json())
    .then(datos => {
      const codigo = datos.current.weather_code;
      const precipitacion = datos.current.precipitation;
      hayLluviaGlobal = precipitacion > 0 || (codigo >= 51 && codigo <= 99);
      dibujarIconoCielo();
    })
    .catch(() => {
    });
}

function iniciarClima() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (posicion) => {
      consultarClima(posicion.coords.latitude, posicion.coords.longitude);
      setInterval(() => consultarClima(posicion.coords.latitude, posicion.coords.longitude), 15 * 60 * 1000);
    },
    () => {
    }
  );
}

actualizarRelojYFecha();
setInterval(actualizarRelojYFecha, 30000);
iniciarClima();

reiniciarTemporizadoresReposo();

const pantallaBienvenida = document.getElementById('pantalla-bienvenida');
const pantallaLlamada = document.getElementById('pantalla-llamada');
const botonConectar = document.getElementById('boton-conectar');
const estadoTexto = document.getElementById('estado-texto');
const videoLocal = document.getElementById('video-local');
const videoRemoto = document.getElementById('video-remoto');
const cronometroEl = document.getElementById('cronometro');
const estadoConexionEl = document.getElementById('estado-conexion');

let socket;
let conexionPeer;
let streamLocal;
let segundos = 0;
let intervaloCronometro;

botonConectar.addEventListener('click', iniciarTodo);

// ---------- MEDIDOR DE NIVEL DE AUDIO ----------
const rellenoNivelLocal = document.getElementById('relleno-nivel-local');
const rellenoNivelRemoto = document.getElementById('relleno-nivel-remoto');
let medidorLocalActivo = false;
let medidorRemotoActivo = false;

function crearMedidorNivel(stream, elementoRelleno, banderaNombre) {
  const ctx = obtenerAudio();
  const fuente = ctx.createMediaStreamSource(stream);
  const analizador = ctx.createAnalyser();
  analizador.fftSize = 256;
  fuente.connect(analizador);
  const datos = new Uint8Array(analizador.frequencyBinCount);

  if (banderaNombre === 'local') medidorLocalActivo = true;
  if (banderaNombre === 'remoto') medidorRemotoActivo = true;

  function actualizar() {
    const activo = banderaNombre === 'local' ? medidorLocalActivo : medidorRemotoActivo;
    if (!activo) return;
    analizador.getByteFrequencyData(datos);
    const promedio = datos.reduce((a, b) => a + b, 0) / datos.length;
    const porcentaje = Math.min(100, (promedio / 100) * 100);
    elementoRelleno.style.width = porcentaje + '%';
    requestAnimationFrame(actualizar);
  }
  actualizar();
}

// ---------- SILENCIAR MICRÓFONO ----------
const botonSilenciar = document.getElementById('boton-silenciar');
let microfonoSilenciado = false;

botonSilenciar.addEventListener('click', () => {
  if (!streamLocal) return;
  microfonoSilenciado = !microfonoSilenciado;
  streamLocal.getAudioTracks().forEach(track => {
    track.enabled = !microfonoSilenciado;
  });
  botonSilenciar.textContent = microfonoSilenciado ? 'Activar micrófono' : 'Silenciar micrófono';
  botonSilenciar.classList.toggle('silenciado', microfonoSilenciado);
});

async function iniciarTodo() {
  estadoTexto.textContent = "Pidiendo acceso a cámara y micrófono...";

  streamLocal = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480 },
    audio: true
  });
  videoLocal.srcObject = streamLocal;
  crearMedidorNivel(streamLocal, rellenoNivelLocal, 'local');

  estadoTexto.textContent = "Conectando con el servidor...";
  conectarSeñalizacion();
}

function conectarSeñalizacion() {
  socket = new WebSocket(URL_SERVIDOR_SEÑALIZACION);

  socket.onopen = () => {
    estadoTexto.textContent = "Conectado al servidor. Esperando a la otra punta...";
  };

  socket.onmessage = async (evento) => {
    const datos = JSON.parse(evento.data);

    if (datos.tipo === 'listo-para-conectar') {
      iniciarLlamada(datos.soyIniciador);
    }

    if (datos.tipo === 'oferta') {
      await conexionPeer.setRemoteDescription(datos.oferta);
      const respuesta = await conexionPeer.createAnswer();
      await conexionPeer.setLocalDescription(respuesta);
      socket.send(JSON.stringify({ tipo: 'respuesta', respuesta }));
    }

    if (datos.tipo === 'respuesta') {
      await conexionPeer.setRemoteDescription(datos.respuesta);
    }

    if (datos.tipo === 'candidato') {
      try {
        await conexionPeer.addIceCandidate(datos.candidato);
      } catch (e) {
        console.log('Error agregando candidato ICE', e);
      }
    }

    if (datos.tipo === 'compañero-desconectado') {
      estadoConexionEl.textContent = "El otro lado se desconectó";
    }
  };
}

async function iniciarLlamada(soyIniciador) {
  conexionPeer = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  streamLocal.getTracks().forEach(track => {
    conexionPeer.addTrack(track, streamLocal);
  });

  conexionPeer.ontrack = (evento) => {
    videoRemoto.srcObject = evento.streams[0];
    crearMedidorNivel(evento.streams[0], rellenoNivelRemoto, 'remoto');
  };

  conexionPeer.onicecandidate = (evento) => {
    if (evento.candidate) {
      socket.send(JSON.stringify({ tipo: 'candidato', candidato: evento.candidate }));
    }
  };

  const estadosEnEspanol = {
    'new': 'Nuevo',
    'connecting': 'Conectando...',
    'connected': 'Conectado',
    'disconnected': 'Desconectado',
    'failed': 'Falló',
    'closed': 'Cerrado'
  };

  conexionPeer.onconnectionstatechange = () => {
    const estado = conexionPeer.connectionState;
    estadoConexionEl.textContent = estadosEnEspanol[estado] || estado;
  };

  if (soyIniciador) {
    const oferta = await conexionPeer.createOffer();
    await conexionPeer.setLocalDescription(oferta);
    socket.send(JSON.stringify({ tipo: 'oferta', oferta }));
  }

  mostrarPantallaLlamada();
}

function mostrarPantallaLlamada() {
  pantallaBienvenida.style.display = 'none';
  pantallaLlamada.style.display = 'block';
  segundos = 0;
  intervaloCronometro = setInterval(() => {
    segundos++;
    const min = String(Math.floor(segundos / 60)).padStart(2, '0');
    const seg = String(segundos % 60).padStart(2, '0');
    cronometroEl.textContent = `${min}:${seg}`;
  }, 1000);
}

const botonColgar = document.getElementById('boton-colgar');
botonColgar.addEventListener('click', colgarLlamada);

function colgarLlamada() {
  clearInterval(intervaloCronometro);

  medidorLocalActivo = false;
  medidorRemotoActivo = false;
  rellenoNivelLocal.style.width = '0%';
  rellenoNivelRemoto.style.width = '0%';

  microfonoSilenciado = false;
  botonSilenciar.textContent = 'Silenciar micrófono';
  botonSilenciar.classList.remove('silenciado');

  if (conexionPeer) {
    conexionPeer.close();
    conexionPeer = null;
  }
  if (streamLocal) {
    streamLocal.getTracks().forEach(track => track.stop());
    streamLocal = null;
  }
  if (socket) {
    socket.close();
    socket = null;
  }

  videoLocal.srcObject = null;
  videoRemoto.srcObject = null;

  pantallaLlamada.style.display = 'none';
  pantallaBienvenida.style.display = 'flex';
  estadoTexto.textContent = 'Esperando conexión...';
  ponerEstado(null);
  reiniciarTemporizadoresReposo();
}
</script>
</body>
</html>
