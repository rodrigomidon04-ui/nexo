name: NEXO 3.1 UI layer
on:
  push:
    branches: [nexo-3.1]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'NEXO 3.1: cargar capa de navegación del dashboard aplicada' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar capa UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          tag='<script src="/nexo31-ui.js"></script>'
          if tag not in t:
              marker='</body>'
              if marker not in t:
                  raise SystemExit('No se encontró </body>')
              t=t.replace(marker, tag+'\n'+marker, 1)
              p.write_text(t, encoding='utf-8')
          PY
          grep -Fq '<script src="/nexo31-ui.js"></script>' index.html
      - name: Commit integración
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "NEXO 3.1: cargar capa de navegación del dashboard aplicada"
          git push origin HEAD:nexo-3.1
