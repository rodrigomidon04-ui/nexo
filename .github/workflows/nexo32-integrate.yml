name: NEXO 3.2 preview integration
on:
  push:
    branches: [nexo-3.2]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ github.event.head_commit.message != 'NEXO 3.2: integrar perfil y presencia aplicado' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar NEXO 3.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          tag='<script src="/nexo32.js"></script>'
          if tag not in t:
              if '</body>' not in t:
                  raise SystemExit('No se encontró </body>')
              t=t.replace('</body>',tag+'\n</body>',1)
              p.write_text(t,encoding='utf-8')
          PY
          grep -Fq '<script src="/nexo32.js"></script>' index.html
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "NEXO 3.2: integrar perfil y presencia aplicado"
          git push origin HEAD:nexo-3.2
