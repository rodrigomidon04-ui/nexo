name: NEXO Pages Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate NEXO assistant scripts into index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
            '<script src="./nexo-v9-assistant.js?v=9.0"></script>',
            '<script src="./nexo-v10-actions.js?v=10.0"></script>',
            '<script src="./nexo-v11-voice.js?v=11.0"></script>',
            '<script src="./nexo-face-original.js?v=1.0"></script>',
          ]
          changed = False
          for tag in tags:
            if tag not in s:
              if '</body>' not in s:
                raise SystemExit('No se encontró </body> en index.html')
              s = s.replace('</body>', tag + '</body>')
              changed = True
          if changed:
            p.write_text(s, encoding='utf-8')
          PY

      - name: Commit integrated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
          else
            git commit -m "NEXO Pages: integrar asistente V9-V11"
            git push
          fi
